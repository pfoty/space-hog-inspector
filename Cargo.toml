[package]
name = "space-hog-inspector"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.2.9"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
muda = "0.21.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
